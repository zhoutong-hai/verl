envs:
  RUN_NAME_PREFIX: glm45_air_section3_physics
  VERL_GIT_URL: https://github.com/zhoutong-hai/verl.git
  VERL_GIT_BRANCH: codex/sdpo-megatron-v070
  VERL_REPO_DIR: /root/verl-section3-glm-air-physics
  PHYSICS_DATA_DIR: /hai/zhoutong/section3_physics_assets/data/sciknoweval_physics
  MODEL_PATH: /hai/shared/pretrained_models/GLM-4.5-Air
  VARIANT: sdpo_megatron
  WANDB_PROJECT: main_models_zhoutong
  WANDB_ENTITY: hippocraticai
  WANDB_EXP_NAME: <placeholder>
  TRAIN_TP_SIZE: "2"
  TRAIN_PP_SIZE: "2"
  TRAIN_CP_SIZE: "1"
  TRAIN_EP_SIZE: "4"
  TRAIN_ETP_SIZE: "1"
  ROLLOUT_TP_SIZE: "8"
  ROLLOUT_PP_SIZE: "1"
  VLLM_GPU_MEM_UTIL: "0.24"
  N_GPUS_PER_NODE: "8"
  NNODES: "4"
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  VLLM_USE_V1: "1"
  VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
  VLLM_USE_NCCL_SYMM_MEM: "0"
  VLLM_ENABLE_PREFIX_CACHING: "1"
  HF_HUB_ENABLE_HF_TRANSFER: "1"
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
  NVTE_FUSED_ATTN: "0"
  NVTE_FLASH_ATTN: "1"
  NCCL_NVLS_ENABLE: "0"
  NCCL_ASYNC_ERROR_HANDLING: "1"
  NCCL_TIMEOUT: "1200"
  NCCL_BLOCKING_WAIT: "0"
  NCCL_IB_DISABLE: "0"
  NCCL_SOCKET_IFNAME: "^lo,docker0,virbr0"
  NCCL_CROSS_NIC: "1"
  NCCL_CROSS_HWLOC: "1"
  NCCL_NSOCKS_PERTHREAD: "8"
  NCCL_NTHREADS: "512"
  NCCL_MIN_NCHANNELS: "4"
  NCCL_DEBUG: WARN
  NCCL_DEBUG_SUBSYS: "INIT,GRAPH,TUNING,COLL"

resources:
  infra: k8s/hai-training
  accelerators: H200:8
  image_id: docker:verlai/verl:app-verl0.5-transformers4.55.4-vllm0.10.0-mcore0.13.0-te2.2
  network_tier: best
  disk_tier: best
  cpus: 100+
  memory: 2000+
  ports: 8265

num_nodes: 4

secrets:
  WANDB_API_KEY: ""

config:
  kubernetes:
    pod_config:
      spec:
        containers:
          - volumeMounts:
              - mountPath: /hai/
                name: hai
        volumes:
          - name: hai
            persistentVolumeClaim:
              claimName: hai
              readOnly: false

setup: |
  pkill -f '/tmp/ray/session_' || true
  sleep 2

  rm -rf "$VERL_REPO_DIR"
  git clone --branch "$VERL_GIT_BRANCH" "$VERL_GIT_URL" "$VERL_REPO_DIR"
  cd "$VERL_REPO_DIR"
  pip3 install --upgrade pip packaging
  pip3 install -v -e .[vllm]
  pip3 install --upgrade \
    "transformers==4.57.1" \
    "huggingface_hub==0.36.2"

  pip3 install --upgrade "nvidia-modelopt[torch]==0.40.0"
  pip3 install --upgrade "megatron-core==0.15.0"
  pip3 install --no-deps "git+https://github.com/NVIDIA-NeMo/Megatron-Bridge.git@v0.2.2"

  python3 - <<'PY'
  import re
  import subprocess
  from pathlib import Path

  loc = subprocess.run(["pip3", "show", "megatron-bridge"], capture_output=True, text=True, check=True).stdout
  match = re.search(r"Location: (.+)", loc)
  if match is None:
      raise SystemExit("megatron-bridge install path not found")

  site = Path(match.group(1).strip())

  gpt = site / "megatron/bridge/models/gpt_provider.py"
  if gpt.exists():
      text = gpt.read_text()
      old = "import modelopt.torch.distill as mtd\nimport modelopt.torch.distill.plugins.megatron as mtd_mcore"
      new = (
          "try:\n"
          "    import modelopt.torch.distill as mtd\n"
          "    import modelopt.torch.distill.plugins.megatron as mtd_mcore\n"
          "except ImportError:\n"
          "    mtd = None\n"
          "    mtd_mcore = None"
      )
      if old in text and "mtd_mcore = None" not in text:
          gpt.write_text(text.replace(old, new))
          print(f"Patched {gpt}")
      else:
          print(f"No gpt_provider patch needed: {gpt}")

  param_mapping = site / "megatron/bridge/models/conversion/param_mapping.py"
  if param_mapping.exists():
      text = param_mapping.read_text()
      old = "\n".join(
          [
              "        target_tensor_spec = None",
              "        src_rank = None  # Rank *inside* the PP group.",
              "        for rank, spec in enumerate(tensor_spec_output):",
              "            if spec is not None:",
              "                if target_tensor_spec is not None:",
              '                    raise ValueError(f"Tensor exists on more than one PP rank. Found on ranks {src_rank} and {rank}.")',
              "                target_tensor_spec = spec",
              "                src_rank = rank",
              "",
          ]
      )
      new = "\n".join(
          [
              "        target_tensor_spec = None",
              "        src_rank = None  # Rank *inside* the PP group.",
              "        duplicate_ranks = []",
              "        for rank, spec in enumerate(tensor_spec_output):",
              "            if spec is not None:",
              "                if target_tensor_spec is None:",
              "                    target_tensor_spec = spec",
              "                    src_rank = rank",
              "                elif spec != target_tensor_spec:",
              "                    raise ValueError(",
              '                        f"Tensor exists on more than one PP rank with mismatched specs for {cache_key}. "',
              '                        f"Found ranks {src_rank} and {rank}: {target_tensor_spec} vs {spec}."',
              "                    )",
              "                else:",
              "                    duplicate_ranks.append(rank)",
              "",
              "        if duplicate_ranks:",
              '            warned = getattr(self, "_duplicate_pp_rank_warned_cache", None)',
              "            if warned is None:",
              "                warned = set()",
              "                self._duplicate_pp_rank_warned_cache = warned",
              "            warn_key = cache_key if cache_key is not None else (src_rank, tuple(duplicate_ranks), target_tensor_spec)",
              "            if warn_key not in warned:",
              "                logger.warning(",
              '                    "Tensor exists on multiple PP ranks with identical specs; using source rank %s for cache_key=%s and ignoring duplicate ranks=%s",',
              "                    src_rank,",
              "                    cache_key,",
              "                    duplicate_ranks,",
              "                )",
              "                warned.add(warn_key)",
              "",
          ]
      )
      if old in text and "duplicate_ranks = []" not in text:
          param_mapping.write_text(text.replace(old, new))
          print(f"Patched {param_mapping}")
      else:
          print(f"No param_mapping patch needed: {param_mapping}")
  PY

  python3 -c "import verl; import pathlib; print(pathlib.Path(verl.__file__).resolve())"

  test -f "$VERL_REPO_DIR/pyproject.toml"
  test -f "$PHYSICS_DATA_DIR/train.json"
  test -f "$PHYSICS_DATA_DIR/test.json"
  test -f "$MODEL_PATH/config.json"
  test -f "$MODEL_PATH/chat_template.jinja"

run: |
  set -euo pipefail
  cd "$VERL_REPO_DIR"
  export CUDA_DEVICE_MAX_CONNECTIONS="${CUDA_DEVICE_MAX_CONNECTIONS:-1}"
  export VLLM_ALLREDUCE_USE_SYMM_MEM=0
  export VLLM_USE_NCCL_SYMM_MEM=0
  export NCCL_NVLS_ENABLE=0
  export TORCH_SYMM_MEM_ALLOW_OVERLAPPING_DEVICES=0
  export VLLM_ENABLE_PREFIX_CACHING=1
  export VLLM_WORKER_MULTIPROC_METHOD=spawn
  export RAY_DATA_HOME="${HOME}/verl"
  export HF_HOME=/tmp/huggingface_cache
  export WANDB_PROJECT="$WANDB_PROJECT"
  export WANDB_ENTITY="$WANDB_ENTITY"
  export RAY_ADDRESS=127.0.0.1:6379
  mkdir -p "$HF_HOME"

  HEAD_IP=$(echo "$SKYPILOT_NODE_IPS" | head -n1)
  NUM_NODES=${SKYPILOT_NUM_NODES:-1}

  if [ "$SKYPILOT_NODE_RANK" == "0" ]; then
    echo "Starting Ray head node..."
    cd /root
    if ! ray status --address="$RAY_ADDRESS" >/dev/null 2>&1; then
      pkill -f '/tmp/ray/session_' || true
      sleep 2
      ray start --head --disable-usage-stats \
        --port=6379 \
        --dashboard-host=0.0.0.0 \
        --dashboard-port=8265
    fi
    until ray status --address="$RAY_ADDRESS" >/dev/null 2>&1; do
      echo "Waiting for custom Ray on 127.0.0.1:6379..."
      sleep 2
    done
    until [ "$(ray list nodes | grep ALIVE | wc -l)" -ge "$NUM_NODES" ]; do
      echo "Waiting for all Ray nodes to join... ($(ray list nodes | grep ALIVE | wc -l)/$NUM_NODES)"
      sleep 5
    done
    cd "$VERL_REPO_DIR"

    trainer_logger="['console']"
    if [ -n "${WANDB_API_KEY:-}" ]; then
      python3 -c "import wandb; wandb.login(relogin=True, key='$WANDB_API_KEY')"
      trainer_logger="['console','wandb']"
    fi

    PHYSICS_TRAIN_FILE="${PHYSICS_DATA_DIR}/train.parquet"
    PHYSICS_VAL_FILE="${PHYSICS_DATA_DIR}/test.parquet"
    if [ ! -f "$PHYSICS_TRAIN_FILE" ] || [ ! -f "$PHYSICS_VAL_FILE" ]; then
      echo "Preprocessed parquet not found. Generating from $PHYSICS_DATA_DIR ..."
      python3 "$VERL_REPO_DIR/examples/data_preprocess/sdpo_generalization.py" \
        --data_source "$PHYSICS_DATA_DIR"
    fi

    RUN_TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    if [ -z "${WANDB_EXP_NAME:-}" ] || [ "$WANDB_EXP_NAME" = "<placeholder>" ]; then
      EXPERIMENT_NAME="${RUN_NAME_PREFIX}_${VARIANT}_${RUN_TIMESTAMP}"
    else
      EXPERIMENT_NAME="$WANDB_EXP_NAME"
    fi
    VALIDATION_DATA_DIR="/hai/zhoutong/section3_physics_assets/validation_generations/${EXPERIMENT_NAME}"
    mkdir -p "$VALIDATION_DATA_DIR"

    export EXP_NAME="$EXPERIMENT_NAME"
    export MODEL_PATH
    export PHYSICS_DATA_DIR
    export N_GPUS_PER_NODE="${SKYPILOT_NUM_GPUS_PER_NODE:-$N_GPUS_PER_NODE}"
    export NNODES="$NUM_NODES"
    export TRAIN_TP_SIZE
    export TRAIN_PP_SIZE
    export TRAIN_CP_SIZE
    export TRAIN_EP_SIZE
    export TRAIN_ETP_SIZE
    export ROLLOUT_TP_SIZE
    export ROLLOUT_PP_SIZE
    export VLLM_GPU_MEM_UTIL

    max_prompt_length=2048
    max_response_length=4096
    rollout_max_model_len=6144
    actor_max_token_len=8192
    train_batch_size=16
    ppo_mini_batch_size=16
    rollout_n=8
    test_freq=5
    total_epochs=30
    project_name='glm45_air_section3_physics'

    if [ "$VARIANT" = "sdpo_megatron" ]; then
      config_name='sdpo_megatron_trainer.yaml'
      policy_args=(
        actor_rollout_ref.actor.policy_loss.loss_mode=sdpo
        +actor_rollout_ref.actor.self_distillation.teacher_scoring_mode=trainer_ref
        actor_rollout_ref.actor.self_distillation.support_mode=teacher_topk
        actor_rollout_ref.actor.self_distillation.full_logit_distillation=true
        actor_rollout_ref.actor.self_distillation.distillation_topk=100
        actor_rollout_ref.actor.self_distillation.alpha=0.5
        actor_rollout_ref.actor.self_distillation.success_reward_threshold=0.5
        actor_rollout_ref.actor.self_distillation.teacher_regularization=ema
        actor_rollout_ref.actor.self_distillation.teacher_update_rate=0.05
        actor_rollout_ref.actor.self_distillation.dont_reprompt_on_self_success=true
        actor_rollout_ref.actor.self_distillation.remove_thinking_from_demonstration=true
        actor_rollout_ref.actor.self_distillation.include_environment_feedback=false
        actor_rollout_ref.actor.self_distillation.environment_feedback_only_without_solution=true
        actor_rollout_ref.actor.self_distillation.max_reprompt_len=4096
        actor_rollout_ref.actor.self_distillation.is_clip=2.0
      )
    elif [ "$VARIANT" = "grpo_megatron" ]; then
      config_name='ppo_megatron_trainer.yaml'
      policy_args=()
    else
      echo "Unknown VARIANT=$VARIANT"
      echo "Expected one of: sdpo_megatron, grpo_megatron"
      exit 1
    fi

    python3 -m verl.trainer.main_ppo \
      --config-path="$VERL_REPO_DIR/verl/trainer/config" \
      --config-name="$config_name" \
      data.train_files="['$PHYSICS_TRAIN_FILE']" \
      data.val_files="['$PHYSICS_VAL_FILE']" \
      data.train_batch_size="${train_batch_size}" \
      data.filter_overlong_prompts=true \
      data.max_prompt_length="${max_prompt_length}" \
      data.max_response_length="${max_response_length}" \
      data.shuffle=true \
      data.trust_remote_code=true \
      +data.apply_chat_template_kwargs.enable_thinking=false \
      actor_rollout_ref.model.path="$MODEL_PATH" \
      actor_rollout_ref.model.trust_remote_code=true \
      actor_rollout_ref.model.use_remove_padding=false \
      actor_rollout_ref.model.enable_gradient_checkpointing=true \
      actor_rollout_ref.actor.use_dynamic_bsz=true \
      actor_rollout_ref.actor.ppo_mini_batch_size="${ppo_mini_batch_size}" \
      actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1 \
      actor_rollout_ref.actor.ppo_max_token_len_per_gpu="${actor_max_token_len}" \
      actor_rollout_ref.actor.use_kl_loss=false \
      actor_rollout_ref.actor.optim.lr=1e-5 \
      actor_rollout_ref.actor.optim.lr_warmup_steps=10 \
      actor_rollout_ref.actor.megatron.use_mbridge=true \
      actor_rollout_ref.actor.megatron.vanilla_mbridge=false \
      actor_rollout_ref.actor.megatron.use_remove_padding=false \
      actor_rollout_ref.actor.megatron.param_offload=true \
      actor_rollout_ref.actor.megatron.grad_offload=true \
      actor_rollout_ref.actor.megatron.optimizer_offload=true \
      actor_rollout_ref.actor.megatron.tensor_model_parallel_size="${TRAIN_TP_SIZE}" \
      actor_rollout_ref.actor.megatron.pipeline_model_parallel_size="${TRAIN_PP_SIZE}" \
      actor_rollout_ref.actor.megatron.context_parallel_size="${TRAIN_CP_SIZE}" \
      actor_rollout_ref.actor.megatron.expert_model_parallel_size="${TRAIN_EP_SIZE}" \
      actor_rollout_ref.actor.megatron.expert_tensor_parallel_size="${TRAIN_ETP_SIZE}" \
      actor_rollout_ref.actor.megatron.virtual_pipeline_model_parallel_size=null \
      actor_rollout_ref.actor.megatron.override_transformer_config.recompute_granularity=selective \
      '+actor_rollout_ref.actor.megatron.override_transformer_config.recompute_modules=["core_attn","moe_act","layernorm","mlp","moe"]' \
      +actor_rollout_ref.actor.megatron.override_transformer_config.apply_rope_fusion=true \
      +actor_rollout_ref.actor.megatron.override_transformer_config.masked_softmax_fusion=true \
      +actor_rollout_ref.actor.megatron.override_transformer_config.bias_activation_fusion=true \
      +actor_rollout_ref.actor.megatron.override_transformer_config.bias_dropout_fusion=true \
      +actor_rollout_ref.actor.megatron.override_transformer_config.gradient_accumulation_fusion=true \
      +actor_rollout_ref.actor.megatron.override_transformer_config.deallocate_pipeline_outputs=true \
      +actor_rollout_ref.actor.megatron.override_transformer_config.persist_layer_norm=true \
      +actor_rollout_ref.actor.megatron.override_transformer_config.moe_grouped_gemm=true \
      +actor_rollout_ref.actor.megatron.override_transformer_config.moe_permute_fusion=true \
      +actor_rollout_ref.actor.megatron.override_transformer_config.moe_shared_expert_overlap=false \
      +actor_rollout_ref.actor.megatron.override_transformer_config.moe_token_dispatcher_type=alltoall \
      +actor_rollout_ref.actor.megatron.override_transformer_config.moe_router_dtype=fp32 \
      +actor_rollout_ref.actor.megatron.override_transformer_config.moe_enable_deepep=false \
      actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1 \
      actor_rollout_ref.ref.log_prob_max_token_len_per_gpu="${actor_max_token_len}" \
      actor_rollout_ref.ref.megatron.use_mbridge=true \
      actor_rollout_ref.ref.megatron.vanilla_mbridge=false \
      actor_rollout_ref.ref.megatron.use_remove_padding=false \
      actor_rollout_ref.ref.megatron.param_offload=true \
      actor_rollout_ref.ref.megatron.tensor_model_parallel_size="${TRAIN_TP_SIZE}" \
      actor_rollout_ref.ref.megatron.pipeline_model_parallel_size="${TRAIN_PP_SIZE}" \
      actor_rollout_ref.ref.megatron.context_parallel_size="${TRAIN_CP_SIZE}" \
      actor_rollout_ref.ref.megatron.expert_model_parallel_size="${TRAIN_EP_SIZE}" \
      actor_rollout_ref.ref.megatron.expert_tensor_parallel_size="${TRAIN_ETP_SIZE}" \
      actor_rollout_ref.ref.megatron.virtual_pipeline_model_parallel_size=null \
      actor_rollout_ref.rollout.name=vllm \
      actor_rollout_ref.rollout.n="${rollout_n}" \
      actor_rollout_ref.rollout.calculate_log_probs=true \
      actor_rollout_ref.rollout.gpu_memory_utilization="${VLLM_GPU_MEM_UTIL}" \
      actor_rollout_ref.rollout.tensor_model_parallel_size="${ROLLOUT_TP_SIZE}" \
      actor_rollout_ref.rollout.pipeline_model_parallel_size="${ROLLOUT_PP_SIZE}" \
      actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1 \
      actor_rollout_ref.rollout.max_num_batched_tokens="${rollout_max_model_len}" \
      actor_rollout_ref.rollout.max_model_len="${rollout_max_model_len}" \
      actor_rollout_ref.rollout.val_kwargs.top_p=0.95 \
      actor_rollout_ref.rollout.val_kwargs.temperature=0.6 \
      actor_rollout_ref.rollout.val_kwargs.n=16 \
      actor_rollout_ref.rollout.val_kwargs.do_sample=true \
      algorithm.adv_estimator=grpo \
      algorithm.norm_adv_by_std_in_grpo=false \
      algorithm.use_kl_in_reward=false \
      algorithm.rollout_correction.rollout_is=token \
      algorithm.rollout_correction.rollout_is_threshold=2.0 \
      custom_reward_function.path="$VERL_REPO_DIR/verl/utils/reward_score/feedback/__init__.py" \
      trainer.project_name="${project_name}" \
      trainer.experiment_name="${EXPERIMENT_NAME}" \
      trainer.logger="${trainer_logger}" \
      trainer.log_val_generations=8 \
      trainer.print_val_generations=2 \
      trainer.validation_console_max_chars=1200 \
      trainer.validation_data_dir="${VALIDATION_DATA_DIR}" \
      trainer.validation_dump_generations=32 \
      trainer.n_gpus_per_node="${N_GPUS_PER_NODE}" \
      trainer.nnodes="${NNODES}" \
      trainer.save_freq=-1 \
      trainer.test_freq="${test_freq}" \
      trainer.total_epochs="${total_epochs}" \
      trainer.val_before_train=false \
      trainer.critic_warmup=0 \
      "${policy_args[@]}"
  else
    sleep 15
    echo "Starting Ray worker node..."
    cd /root
    ps aux | grep ray | grep $HEAD_IP:6379 &> /dev/null || ray start --address $HEAD_IP:6379 --disable-usage-stats
    cd "$VERL_REPO_DIR"
    sleep 10
  fi

  echo "SkyPilot GLM-Air physics run finished for rank $SKYPILOT_NODE_RANK."
