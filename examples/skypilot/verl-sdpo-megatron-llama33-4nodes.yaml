envs:
  RUN_NAME_PREFIX: llama33_70b_sdpo_megatron
  TRAIN_FILE: /root/data/llama33_verl_combined/train.parquet
  VAL_FILE: /root/data/llama33_verl_combined/test.parquet
  MODEL_PATH: /hai/shared/pretrained_models/Llama-3.3-70B-merged-616
  CUSTOM_REWARD_FUNCTION_PATH: /root/sky_workdir/path/to/reward_functions.py
  MAX_PROMPT_LENGTH: "13568"
  MAX_RESPONSE_LENGTH: "1024"
  CHAT_TEMPLATE_NOOP: '{% if messages is string %}{{ messages }}{% else %}{% for message in messages %}{% if message is mapping %}{{ message.get("content", "") }}{% else %}{{ message }}{% endif %}{% endfor %}{% endif %}'
  WANDB_PROJECT: verl-rl
  WANDB_ENTITY: your-wandb-entity
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  NCCL_NVLS_ENABLE: "0"
  VLLM_USE_V1: "1"
  VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
  VLLM_ENABLE_PREFIX_CACHING: "1"
  HF_HUB_ENABLE_HF_TRANSFER: "1"
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
  NVTE_FUSED_ATTN: "0"
  NVTE_FLASH_ATTN: "1"
  NCCL_ASYNC_ERROR_HANDLING: "1"
  NCCL_TIMEOUT: "1200"
  NCCL_BLOCKING_WAIT: "0"
  NCCL_IB_DISABLE: "0"
  NCCL_SOCKET_IFNAME: "^lo,docker0,virbr0"
  NCCL_CROSS_NIC: "1"
  NCCL_CROSS_HWLOC: "1"
  NCCL_NSOCKS_PERTHREAD: "8"
  NCCL_NTHREADS: "512"
  NCCL_MIN_NCHANNELS: "4"
  NCCL_DEBUG: WARN
  NCCL_DEBUG_SUBSYS: "INIT,GRAPH,TUNING,COLL"
  VLLM_USE_NCCL_SYMM_MEM: "0"

resources:
  infra: k8s
  accelerators: H200:8
  image_id: docker:verlai/verl:app-verl0.5-transformers4.55.4-vllm0.10.0-mcore0.13.0-te2.2
  network_tier: best
  disk_tier: best
  cpus: 100+
  memory: 2000+
  ports: 8265

num_nodes: 4
workdir: .

setup: |
  cd /root/sky_workdir
  pip3 install --upgrade pip
  pip3 install langdetect

  # Patch verl for the vLLM version bundled in the Docker image.
  sed -i '/enable_log_requests=/d' \
    verl/workers/rollout/vllm_rollout/vllm_async_server.py || true
  sed -i '/stat_loggers=/d' \
    verl/workers/rollout/vllm_rollout/vllm_async_server.py || true

  pip3 install -v -e .[vllm]

  # Megatron-Bridge stack used by the Arrakis launcher.
  pip3 install --upgrade "nvidia-modelopt[torch]==0.40.0"
  pip3 install --upgrade "megatron-core==0.15.0"
  pip3 install --upgrade "transformers==4.57.1"
  pip3 install --no-deps "git+https://github.com/NVIDIA-NeMo/Megatron-Bridge.git@v0.2.2"

  python3 -c "import subprocess,re;from pathlib import Path;loc=subprocess.run(['pip3','show','megatron-bridge'],capture_output=True,text=True).stdout;m=re.search(r'Location: (.+)',loc);site=Path(m.group(1).strip()) if m else None;gpt=site/'megatron/bridge/models/gpt_provider.py' if site else None;c=gpt.read_text() if gpt and gpt.exists() else '';old='import modelopt.torch.distill as mtd\\nimport modelopt.torch.distill.plugins.megatron as mtd_mcore';new='try:\\n    import modelopt.torch.distill as mtd\\n    import modelopt.torch.distill.plugins.megatron as mtd_mcore\\nexcept ImportError:\\n    mtd = None\\n    mtd_mcore = None';c=c.replace(old,new) if old in c else c;gpt.write_text(c) if c and 'mtd_mcore = None' not in gpt.read_text() else None;print(f'Patched {gpt}') if c else print('No patch needed')"

  export HF_HOME=/tmp/huggingface_cache
  mkdir -p $HF_HOME

run: |
  cd /root/sky_workdir
  export CUDA_DEVICE_MAX_CONNECTIONS=1
  export VLLM_ALLREDUCE_USE_SYMM_MEM=0
  export VLLM_USE_NCCL_SYMM_MEM=0
  export TORCH_SYMM_MEM_ALLOW_OVERLAPPING_DEVICES=0
  export VLLM_ENABLE_PREFIX_CACHING=1
  export HF_HOME=/tmp/huggingface_cache
  mkdir -p $HF_HOME
  export VLLM_WORKER_MULTIPROC_METHOD=spawn
  export RAY_DATA_HOME="${HOME}/verl"

  head_ip=`echo "$SKYPILOT_NODE_IPS" | head -n1`
  num_nodes=`echo "$SKYPILOT_NODE_IPS" | wc -l`

  if [ -n "$WANDB_API_KEY" ]; then
    python3 -c "import wandb; wandb.login(relogin=True, key='$WANDB_API_KEY')"
  fi

  if [ "$SKYPILOT_NODE_RANK" == "0" ]; then
    echo "Starting Ray head node..."
    ps aux | grep ray | grep 6379 &> /dev/null || ray start --head --disable-usage-stats \
        --port=6379 \
        --dashboard-host=0.0.0.0 \
        --dashboard-port=8265

    while [ $(ray list nodes | grep ALIVE | wc -l) -lt $num_nodes ]; do
      echo "Waiting for all nodes to join... ($(ray list nodes | grep ALIVE | wc -l)/$num_nodes)"
      sleep 5
    done

    RUN_TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    export RUN_DIR="/tmp/${RUN_NAME_PREFIX}_${RUN_TIMESTAMP}"
    export CHECKPOINT_DIR="${RUN_DIR}/checkpoints"
    export LOG_DIR="${RUN_DIR}/logs"
    mkdir -p "$CHECKPOINT_DIR" "$LOG_DIR"

    max_prompt_length=${MAX_PROMPT_LENGTH}
    max_response_length=${MAX_RESPONSE_LENGTH}
    train_prompt_bsz=32
    n_resp_per_prompt=16
    train_prompt_mini_bsz=8
    train_pp=4
    train_tp=4
    CP=1
    gen_tp=8
    use_dynamic_bsz=True
    actor_ppo_max_token_len=$((max_prompt_length + max_response_length))
    infer_ppo_max_token_len=$((max_prompt_length + max_response_length))
    temperature=1.0
    top_p=0.95
    top_k=-1
    lr=1e-6
    entropy_coeff=0.0
    project_name='verl-rl'
    exp_name="${RUN_NAME_PREFIX}-${num_nodes}nodes-tp${train_tp}-pp${train_pp}-bsz${train_prompt_bsz}x${n_resp_per_prompt}-lr${lr}-sdpo"

    python3 -m verl.trainer.main_ppo \
      --config-path=verl/trainer/config \
      --config-name='sdpo_megatron_trainer.yaml' \
      data.train_files="${TRAIN_FILE}" \
      data.val_files="${VAL_FILE}" \
      data.prompt_key=prompt \
      data.return_full_prompt=true \
      data.truncation='left' \
      data.max_prompt_length=${max_prompt_length} \
      data.max_response_length=${max_response_length} \
      data.train_batch_size=${train_prompt_bsz} \
      data.shuffle=true \
      data.seed=42 \
      data.filter_overlong_prompts=false \
      "+data.apply_chat_template_kwargs.chat_template='$CHAT_TEMPLATE_NOOP'" \
      actor_rollout_ref.rollout.n=${n_resp_per_prompt} \
      actor_rollout_ref.rollout.name=vllm \
      actor_rollout_ref.model.path="${MODEL_PATH}" \
      actor_rollout_ref.model.use_fused_kernels=False \
      actor_rollout_ref.actor.megatron.use_mbridge=True \
      actor_rollout_ref.actor.megatron.vanilla_mbridge=False \
      actor_rollout_ref.actor.use_kl_loss=False \
      actor_rollout_ref.actor.clip_ratio_low=0.2 \
      actor_rollout_ref.actor.clip_ratio_high=0.28 \
      actor_rollout_ref.actor.clip_ratio_c=10.0 \
      actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1 \
      actor_rollout_ref.actor.checkpoint.save_contents=['model'] \
      actor_rollout_ref.actor.use_dynamic_bsz=${use_dynamic_bsz} \
      actor_rollout_ref.actor.ppo_max_token_len_per_gpu=${actor_ppo_max_token_len} \
      actor_rollout_ref.actor.optim.lr=${lr} \
      actor_rollout_ref.actor.optim.lr_decay_style=cosine \
      actor_rollout_ref.actor.optim.min_lr=1e-7 \
      actor_rollout_ref.actor.optim.lr_warmup_steps=20 \
      actor_rollout_ref.actor.optim.weight_decay=0.1 \
      +actor_rollout_ref.actor.optim.override_optimizer_config.optimizer_offload_fraction=0.0 \
      +actor_rollout_ref.actor.optim.override_optimizer_config.overlap_cpu_optimizer_d2h_h2d=True \
      +actor_rollout_ref.actor.optim.override_optimizer_config.use_precision_aware_optimizer=True \
      +actor_rollout_ref.actor.optim.override_optimizer_config.optimizer_cpu_offload=False \
      actor_rollout_ref.actor.ppo_mini_batch_size=${train_prompt_mini_bsz} \
      actor_rollout_ref.actor.megatron.param_offload=False \
      actor_rollout_ref.actor.megatron.optimizer_offload=False \
      actor_rollout_ref.actor.megatron.grad_offload=False \
      actor_rollout_ref.actor.megatron.pipeline_model_parallel_size=${train_pp} \
      actor_rollout_ref.actor.megatron.tensor_model_parallel_size=${train_tp} \
      actor_rollout_ref.actor.megatron.context_parallel_size=${CP} \
      actor_rollout_ref.actor.load_weight=True \
      actor_rollout_ref.actor.entropy_coeff=${entropy_coeff} \
      actor_rollout_ref.actor.optim.clip_grad=1.0 \
      actor_rollout_ref.actor.loss_agg_mode=token-mean \
      actor_rollout_ref.actor.self_distillation.full_logit_distillation=False \
      actor_rollout_ref.actor.self_distillation.alpha=1.0 \
      actor_rollout_ref.actor.self_distillation.teacher_update_rate=0.01 \
      actor_rollout_ref.actor.self_distillation.dont_reprompt_on_self_success=True \
      actor_rollout_ref.actor.self_distillation.include_environment_feedback=False \
      actor_rollout_ref.rollout.dtype=bfloat16 \
      actor_rollout_ref.rollout.gpu_memory_utilization=0.5 \
      +actor_rollout_ref.rollout.engine_kwargs.vllm.max_model_len=16384 \
      actor_rollout_ref.rollout.tensor_model_parallel_size=${gen_tp} \
      actor_rollout_ref.rollout.enable_prefix_caching=True \
      actor_rollout_ref.rollout.enable_chunked_prefill=True \
      actor_rollout_ref.rollout.max_num_batched_tokens=16384 \
      actor_rollout_ref.rollout.temperature=${temperature} \
      actor_rollout_ref.rollout.top_p=${top_p} \
      actor_rollout_ref.rollout.top_k=${top_k} \
      actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=2 \
      actor_rollout_ref.rollout.log_prob_use_dynamic_bsz=${use_dynamic_bsz} \
      actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu=${infer_ppo_max_token_len} \
      actor_rollout_ref.rollout.val_kwargs.temperature=0.0 \
      actor_rollout_ref.rollout.val_kwargs.top_p=1.0 \
      actor_rollout_ref.rollout.val_kwargs.top_k=${top_k} \
      actor_rollout_ref.rollout.val_kwargs.do_sample=False \
      actor_rollout_ref.rollout.val_kwargs.n=1 \
      actor_rollout_ref.rollout.enforce_eager=False \
      actor_rollout_ref.ref.load_weight=True \
      actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=2 \
      actor_rollout_ref.ref.log_prob_use_dynamic_bsz=${use_dynamic_bsz} \
      actor_rollout_ref.ref.log_prob_max_token_len_per_gpu=${infer_ppo_max_token_len} \
      actor_rollout_ref.ref.megatron.pipeline_model_parallel_size=${train_pp} \
      actor_rollout_ref.ref.megatron.tensor_model_parallel_size=${train_tp} \
      actor_rollout_ref.ref.megatron.context_parallel_size=${CP} \
      actor_rollout_ref.ref.megatron.param_offload=True \
      ++actor_rollout_ref.actor.megatron.override_transformer_config.attention_backend=flash \
      +actor_rollout_ref.actor.megatron.override_transformer_config.apply_rope_fusion=True \
      +actor_rollout_ref.actor.megatron.override_transformer_config.recompute_method=uniform \
      +actor_rollout_ref.actor.megatron.override_transformer_config.recompute_granularity=selective \
      +actor_rollout_ref.actor.megatron.override_transformer_config.gradient_accumulation_fusion=True \
      algorithm.adv_estimator=grpo \
      algorithm.norm_adv_by_std_in_grpo=true \
      algorithm.use_kl_in_reward=false \
      algorithm.rollout_correction.rollout_is=token \
      algorithm.rollout_correction.rollout_is_threshold=2.0 \
      reward_model.reward_manager=dapo \
      +reward_model.reward_kwargs.overlong_buffer_cfg.enable=true \
      +reward_model.reward_kwargs.overlong_buffer_cfg.len=512 \
      +reward_model.reward_kwargs.overlong_buffer_cfg.penalty_factor=1.0 \
      +reward_model.reward_kwargs.overlong_buffer_cfg.log=false \
      +reward_model.reward_kwargs.max_resp_len=${max_response_length} \
      custom_reward_function.path="${CUSTOM_REWARD_FUNCTION_PATH}" \
      custom_reward_function.name=compute_score \
      trainer.logger=['console','wandb'] \
      trainer.project_name="${project_name}" \
      trainer.experiment_name="${exp_name}" \
      trainer.n_gpus_per_node=8 \
      trainer.nnodes="${num_nodes}" \
      trainer.val_before_train=true \
      trainer.test_freq=16 \
      trainer.save_freq=64 \
      trainer.total_epochs=10 \
      trainer.default_local_dir="${CHECKPOINT_DIR}" \
      trainer.resume_mode=auto \
      trainer.log_val_generations=64 \
      +trainer.validation_data_dir="${LOG_DIR}/val_dumps" \
      +trainer.rollout_data_dir="${LOG_DIR}/rollout_dumps"

  else
    sleep 10
    echo "Starting Ray worker node..."
    ps aux | grep ray | grep $head_ip:6379 &> /dev/null || ray start --address $head_ip:6379 --disable-usage-stats
    sleep 5
  fi
