envs:
  RUN_NAME_PREFIX: olmo3_7b_section3_chemistry
  VERL_GIT_URL: https://github.com/zhoutong-hai/verl.git
  VERL_GIT_BRANCH: codex/sdpo-megatron-v070
  VERL_REPO_DIR: /root/verl-section3-chemistry
  CHEMISTRY_DATA_DIR: /hai/zhoutong/section3_chemistry_assets/data/sciknoweval_chemistry
  MODEL_PATH: /hai/zhoutong/section3_chemistry_assets/models/Olmo-3-7B-Instruct
  MODEL_REPO_ID: allenai/Olmo-3-7B-Instruct
  VARIANT: sdpo_fsdp
  WANDB_PROJECT: main_models_zhoutong
  WANDB_ENTITY: hippocraticai
  WANDB_EXP_NAME: <placeholder>
  N_GPUS_PER_NODE: "8"
  NNODES: "1"
  VLLM_USE_V1: "1"
  VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
  VLLM_USE_NCCL_SYMM_MEM: "0"
  VLLM_ENABLE_PREFIX_CACHING: "1"
  HF_HUB_ENABLE_HF_TRANSFER: "1"
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
  NVTE_FUSED_ATTN: "0"
  NVTE_FLASH_ATTN: "1"

resources:
  infra: k8s/hai-training
  accelerators: H200:8
  memory: 128+
  image_id: docker:verlai/verl:app-verl0.5-transformers4.55.4-vllm0.10.0-mcore0.13.0-te2.2
  ports: 8265

num_nodes: 1

secrets:
  WANDB_API_KEY:

config:
  kubernetes:
    pod_config:
      spec:
        containers:
          - volumeMounts:
              - mountPath: /hai/
                name: hai
        volumes:
          - name: hai
            persistentVolumeClaim:
              claimName: hai
              readOnly: false

setup: |
  pkill -f '/tmp/ray/session_' || true
  sleep 2

  rm -rf "$VERL_REPO_DIR"
  git clone --branch "$VERL_GIT_BRANCH" "$VERL_GIT_URL" "$VERL_REPO_DIR"
  cd "$VERL_REPO_DIR"
  pip3 install --upgrade pip packaging
  pip3 install -v -e .[vllm]
  pip3 install --upgrade huggingface_hub
  python3 -c "import verl; import pathlib; print(pathlib.Path(verl.__file__).resolve())"

  mkdir -p "$MODEL_PATH"
  if [ ! -f "$MODEL_PATH/config.json" ]; then
    python3 - <<'PY'
    from huggingface_hub import snapshot_download
    import os

    snapshot_download(
        repo_id=os.environ["MODEL_REPO_ID"],
        local_dir=os.environ["MODEL_PATH"],
    )
    print("olmo_download_complete")
    PY
  fi

  test -f "$VERL_REPO_DIR/pyproject.toml"
  test -f "$CHEMISTRY_DATA_DIR/train.json"
  test -f "$CHEMISTRY_DATA_DIR/test.json"
  test -f "$MODEL_PATH/config.json"

run: |
  set -euo pipefail
  cd "$VERL_REPO_DIR"
  export VLLM_ALLREDUCE_USE_SYMM_MEM=0
  export VLLM_USE_NCCL_SYMM_MEM=0
  export TORCH_SYMM_MEM_ALLOW_OVERLAPPING_DEVICES=0
  export VLLM_ENABLE_PREFIX_CACHING=1
  export VLLM_WORKER_MULTIPROC_METHOD=spawn
  export RAY_DATA_HOME="${HOME}/verl"
  export HF_HOME=/tmp/huggingface_cache
  export WANDB_PROJECT="$WANDB_PROJECT"
  export WANDB_ENTITY="$WANDB_ENTITY"
  export RAY_ADDRESS=127.0.0.1:6379
  mkdir -p "$HF_HOME"

  HEAD_IP=$(echo "$SKYPILOT_NODE_IPS" | head -n1)
  NUM_NODES=${SKYPILOT_NUM_NODES:-1}

  if [ "$SKYPILOT_NODE_RANK" == "0" ]; then
    echo "Starting Ray head node..."
    cd /root
    if ! ray status --address="$RAY_ADDRESS" >/dev/null 2>&1; then
      pkill -f '/tmp/ray/session_' || true
      sleep 2
      ray start --head --disable-usage-stats \
        --port=6379 \
        --dashboard-host=0.0.0.0 \
        --dashboard-port=8265
    fi
    until ray status --address="$RAY_ADDRESS" >/dev/null 2>&1; do
      echo "Waiting for custom Ray on 127.0.0.1:6379..."
      sleep 2
    done
    cd "$VERL_REPO_DIR"

    if [ -n "${WANDB_API_KEY:-}" ]; then
      python3 -c "import wandb; wandb.login(relogin=True, key='$WANDB_API_KEY')"
    fi

    RUN_TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    if [ -z "${WANDB_EXP_NAME:-}" ] || [ "$WANDB_EXP_NAME" = "<placeholder>" ]; then
      EXPERIMENT_NAME="${RUN_NAME_PREFIX}_${VARIANT}_${RUN_TIMESTAMP}"
    else
      EXPERIMENT_NAME="$WANDB_EXP_NAME"
    fi

    export EXP_NAME="$EXPERIMENT_NAME"
    export MODEL_PATH
    export CHEMISTRY_DATA_DIR
    export N_GPUS_PER_NODE="${SKYPILOT_NUM_GPUS_PER_NODE:-$N_GPUS_PER_NODE}"
    export NNODES="$NUM_NODES"

    bash "$VERL_REPO_DIR/examples/sdpo_trainer/run_olmo3_7b_sciknoweval_chemistry_section3.sh"
  else
    sleep 15
    echo "Starting Ray worker node..."
    cd /root
    ps aux | grep ray | grep $HEAD_IP:6379 &> /dev/null || ray start --address $HEAD_IP:6379 --disable-usage-stats
    cd "$VERL_REPO_DIR"
    sleep 10
  fi

  echo "SkyPilot OLMo chemistry run finished for rank $SKYPILOT_NODE_RANK."
