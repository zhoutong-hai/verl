defaults:
  - ppo_trainer
  - section4_livecodebench_user
  - _self_

# MAX_PROMPT_LENGTH=2048
# MAX_RESPONSE_LENGTH=8192
# MAX_FEEDBACK_LENGTH=8192
# TEMPLATE_LENGTH=512
max_model_len: ${oc.decode:${oc.env:MAX_MODEL_LEN,18944}}

actor_rollout_ref:
  actor:
    ppo_mini_batch_size: ${oc.decode:${oc.env:PPO_MINI_BATCH_SIZE,32}}
    policy_loss:
      loss_mode: sdpo
    self_distillation:
      teacher_scoring_mode: actor_worker
      full_logit_distillation: true
      support_mode: teacher_topk
      distillation_topk: 20
      alpha: 1.0
      success_reward_threshold: ${oc.decode:${oc.env:SUCCESS_REWARD_THRESHOLD,1.0}}
      teacher_regularization: ema
      teacher_update_rate: 0.01
      dont_reprompt_on_self_success: true
      remove_thinking_from_demonstration: true
      include_environment_feedback: true
      environment_feedback_only_without_solution: true
      include_failed_attempt_in_feedback_only: true
      failed_attempt_extract_code_only: true
      failed_attempt_max_chars: ${oc.decode:${oc.env:FAILED_ATTEMPT_MAX_CHARS,1200}}
      max_reprompt_len: ${oc.decode:${oc.env:MAX_REPROMPT_LEN,10240}}
      reprompt_template: |
        {prompt}

        The following reference material is provided only to help you solve the original question.
        {solution}{failed_attempt}{feedback}
        Answer the original question again.
        If a previous unsuccessful attempt is shown, repair it privately instead of repeating its mistakes.
        Reply with exactly one ```python ... ``` block.
        Do not include any explanation, prompt echo, sample-output echo, or mention of the reference material.
      solution_template: |

        Reference successful attempt (use the code logic only; ignore any prose or text outside the code block):

        {successful_previous_attempt}

      failed_attempt_template: |

        Reference unsuccessful code to repair (use only for debugging context; do not copy it verbatim or mention it):

        {previous_attempt}

      feedback_template: |

        Reference feedback from an earlier unsuccessful attempt (use it privately to repair the failed attempt; do not mention it in your answer):

        {feedback_raw}

      is_clip: 2.0
    optim:
      lr: ${oc.decode:${oc.env:ACTOR_LR,1e-5}}
      lr_warmup_steps: 0
  rollout:
    n: 8
    calculate_log_probs: true
    val_kwargs:
      n: 4

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: false
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0

data:
  train_batch_size: 32

trainer:
  val_before_train: false
